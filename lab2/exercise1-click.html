<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>jQuery Click</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h1>jQuery Click</h1>

    <p>
        Enter your score:
        <input type="text" id="score">
    </p>

    <button id="gradeButton">Enter a score</button>

    <div id="result"></div>

    <script>
        $(document).ready(function() {

            $("#gradeButton").click(function() {

                let score = $("#score").val();
                let grade;

                if (score >= 90) {
                    grade = "A";
                } 
                else if (score >= 80) {
                    grade = "B";
                } 
                else if (score >= 70) {
                    grade = "C";
                } 
                else {
                    grade = "F";
                }

                $("#result").html(
                    "Your score is " + score + " and your grade is " + grade
                );

            });

        });
    </script>

</body>

</html>
