<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>jQuery Calculator</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h1>jQuery Calculator</h1>

    <label for="number1">First Number:</label>
    <input type="text" id="number1">

    <br><br>

    <label for="number2">Second Number:</label>
    <input type="text" id="number2">

    <br><br>

    <label for="operation">Operation:</label>
    <select id="operation">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">*</option>
        <option value="divide">/</option>
    </select>

    <br><br>

    <label for="color">Result Color:</label>
    <input type="text" id="color" placeholder="Example: blue">

    <br><br>

    <button id="calculateButton">Calculate</button>

    <p id="error"></p>
    <h2 id="result"></h2>

    <script>
        $(document).ready(function () {

            $("#calculateButton").click(function () {

                var number1 = $("#number1").val();
                var number2 = $("#number2").val();
                var operation = $("#operation").val();
                var color = $("#color").val();

                $("#error").text("");
                $("#result").text("");

                if (number1 === "" || number2 === "") {
                    $("#error").text("Please enter both numbers.");
                    return;
                }

                number1 = parseFloat(number1);
                number2 = parseFloat(number2);

                if (isNaN(number1) || isNaN(number2)) {
                    $("#error").text("Please enter valid numbers.");
                    return;
                }

                var answer;

                if (operation === "add") {
                    answer = number1 + number2;
                } else if (operation === "subtract") {
                    answer = number1 - number2;
                } else if (operation === "multiply") {
                    answer = number1 * number2;
                } else if (operation === "divide") {

                    if (number2 === 0) {
                        $("#error").text("Cannot divide by zero.");
                        return;
                    }

                    answer = number1 / number2;
                }

                $("#result").text("Result: " + answer);

                if (color !== "") {
                    $("#result").css("color", color);
                }

            });

        });
    </script>

</body>

</html>
