<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>jQuery CSS</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <h1>Change CSS Styles Using jQuery</h1>

    <button id="changeStyle">Change Style</button>

    <div id="result"
         style="margin-top: 20px; width: 250px; height: 100px; border: 5px solid black;">
        jQuery CSS Example
    </div>

    <script>
        $(document).ready(function() {

            function getRandomColorCode() {
                let red = Math.floor(Math.random() * 255);
                let green = Math.floor(Math.random() * 255);
                let blue = Math.floor(Math.random() * 255);

                return "rgb(" + red + "," + green + "," + blue + ")";
            }

            $("#changeStyle").click(function() {

                let height = Math.floor(Math.random() * 100) + 50;
                let width = Math.floor(Math.random() * 200) + 200;
                let borderWidth = Math.floor(Math.random() * 20) + 5;

                $("#result").css({
                    "background-color": getRandomColorCode(),
                    "height": height + "px",
                    "width": width + "px",
                    "border-width": borderWidth + "px",
                    "border-color": getRandomColorCode(),
                    "border-style": "solid"
                });

            });

        });
    </script>

</body>

</html>
