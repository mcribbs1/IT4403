<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 - Exercise 3</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .book {
            background-color: #f4f4f4;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
        }

        .book h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <h1>Lab 3: JSON - Exercise 3</h1>

    <div id="bookList"></div>

    <script>
        $(document).ready(function () {

            const bookData = {
                "books": [
                    {
                        "title": "Web Development Basics",
                        "author": "Maya Lee",
                        "price": 29.99
                    },
                    {
                        "title": "Modern JavaScript",
                        "author": "Daniel Kim",
                        "price": 34.50
                    },
                    {
                        "title": "Understanding JSON",
                        "author": "Sofia Patel",
                        "price": 24.95
                    }
                ]
            };

            // Display the first book
            $("#bookList").append(
                '<div class="book">' +
                '<h2>First Book</h2>' +
                '<p><strong>Title:</strong> ' + bookData.books[0].title + '</p>' +
                '<p><strong>Author:</strong> ' + bookData.books[0].author + '</p>' +
                '<p><strong>Price:</strong> $' + bookData.books[0].price.toFixed(2) + '</p>' +
                '</div>'
            );

            // Display the total number of books
            $("#bookList").append(
                '<p><strong>Total Number of Books:</strong> ' +
                bookData.books.length +
                '</p>'
            );

            // Loop through all books
            $("#bookList").append('<h2>All Books</h2>');

            $.each(bookData.books, function (index, book) {
                $("#bookList").append(
                    '<div class="book">' +
                    '<h2>' + book.title + '</h2>' +
                    '<p><strong>Author:</strong> ' + book.author + '</p>' +
                    '</div>'
                );
            });

        });
    </script>

</body>
</html>
