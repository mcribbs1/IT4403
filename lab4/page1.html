<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - User Albums</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Lab 4: RESTful Web APIs</h1>
<h2>User Information</h2>
<div id="userInfo"></div>

<h2>User Albums</h2>
<div id="albumList"></div>
<script>
    // Retrieve user information from the API
    fetch("https://jsonplaceholder.typicode.com/users/1")
        .then(response => response.json())
        .then(user => {
            document.getElementById("userInfo").innerHTML = `
                <p><strong>Name:</strong> ${user.name}</p>
                <p><strong>Username:</strong> ${user.username}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Address:</strong> ${user.address.street},
                    ${user.address.city}</p>
                <p><strong>Phone:</strong> ${user.phone}</p>
                <p><strong>Website:</strong> ${user.website}</p>
                <p><strong>Company:</strong> ${user.company.name}</p>
            `;
        })
        .catch(error => {
            document.getElementById("userInfo").textContent =
                "Error loading user information.";
            console.error(error);
        });
        
    // Retrieve all albums for User 1
    fetch("https://jsonplaceholder.typicode.com/albums?userId=1")
        .then(response => response.json())
        .then(albums => {
            let albumHTML = "<ul>";

            albums.forEach(album => {
                albumHTML += `
                    <li>
                        <a href="page2.html?albumId=${album.id}">
                            ${album.title}
                        </a>
                    </li>
                `;
            });

            albumHTML += "</ul>";

            document.getElementById("albumList").innerHTML = albumHTML;
        })
        .catch(error => {
            document.getElementById("albumList").textContent =
                "Error loading albums.";
            console.error(error);
        });
</script>
</body>
</html>
