<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milestone 1 - Search Results</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }

        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .book {
            background-color: #f4f4f4;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
            overflow: auto;
        }

        .book img {
            max-width: 140px;
            float: left;
            margin-right: 20px;
            margin-bottom: 10px;
        }

        .book h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <h1>Milestone 1: Open Library Search Results</h1>

    <p>Search results for: <strong>modern web</strong></p>

    <div id="searchResults"></div>

    <script>
        $(document).ready(function () {

            $.getJSON("openlibrary-search.json", function (data) {

                $.each(data.docs, function (index, book) {

                    let authors = book.author_name
                        ? book.author_name.join(", ")
                        : "Not available";

                    let year = book.first_publish_year || "Not available";

                    let editions = book.edition_count || "Not available";

                    let languages = book.language
                        ? book.language.join(", ")
                        : "Not available";

                    let cover = "";

                    if (book.cover_i) {
                        cover =
                            '<img src="https://covers.openlibrary.org/b/id/' +
                            book.cover_i +
                            '-M.jpg" alt="Cover of ' +
                            book.title +
                            '">';
                    }

                    let bookLink = book.key
                        ? "https://openlibrary.org" + book.key
                        : "#";

                    $("#searchResults").append(
                        '<div class="book">' +
                            cover +
                            '<h2>' + (book.title || "Title not available") + '</h2>' +
                            '<p><strong>Author:</strong> ' + authors + '</p>' +
                            '<p><strong>First Publication Year:</strong> ' + year + '</p>' +
                            '<p><strong>Edition Count:</strong> ' + editions + '</p>' +
                            '<p><strong>Language:</strong> ' + languages + '</p>' +
                            '<p><a href="' + bookLink + '" target="_blank">View on Open Library</a></p>' +
                        '</div>'
                    );

                });

            });

        });
    </script>

</body>

</html>
